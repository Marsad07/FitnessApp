{% extends "online/base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
    <div class="max-w-md mx-auto mt-4 sm:mt-10 rounded-2xl bg-talokan border border-white/5 shadow-card p-7 sm:p-9 animate__animated animate__zoomIn">
        <h1 class="font-head text-3xl font-bold tracking-tight text-center">Welcome back</h1>
        <p class="text-muted text-center mt-2 mb-7">Log in to see today's nutrition.</p>

        <form method="post" action="{{ url_for('auth.login') }}" class="grid gap-4">
            <div>
                <label for="email" class="block text-sm font-semibold text-muted mb-1.5">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com"
                       class="w-full rounded-xl bg-talokan-2 border border-white/10 px-4 py-3 text-mourning placeholder-muted/70 focus:outline-none focus:border-vibranium focus:ring-4 focus:ring-vibranium/25 transition">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-muted mb-1.5">Password</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="current-password"
                       class="w-full rounded-xl bg-talokan-2 border border-white/10 px-4 py-3 text-mourning focus:outline-none focus:border-vibranium focus:ring-4 focus:ring-vibranium/25 transition">
            </div>
            <button type="submit" class="btn-gold mt-2 rounded-xl bg-gold hover:bg-gold-2 text-panther font-bold px-5 py-3.5 transition">Log in</button>
        </form>

        <p class="text-center text-muted mt-6">New here? <a href="{{ url_for('auth.register') }}" class="text-gold font-semibold hover:underline">Create an account</a></p>
    </div>
{% endblock %}
