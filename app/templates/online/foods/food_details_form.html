<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Details Form</title>
</head>
<body>
    <h1 style="text-alignment=center"></h1><br>
    <div>
        <!-- If editing an existing entry, submit to edit_entry - otherwise submit to food_chosen
        (logging a brand new food) -->
        <form method="get" action="{% if entry_id %}/routes/edit_entry{% else %}/routes/food_chosen{% endif %}">
            {% if entry_id %}
                <input type="hidden" name="entry_id" value="{{ entry_id }}">
            {% else %}
                <input type="hidden" name="fdcId" value="{{ fdc_id }}">
            {% endif %}
            <label for="meal_category">Meal Category</label><br>
            <select name="meal_category" id="meal_category">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
            </select><br>

            <h3>Food Weight</h3><br>
            <label for="food_weight"></label>
            <input type="number" id="food_weight" name="food_weight">
            <button type="submit" id="submit_btn">Submit</button>
        </form>
    </div>
</body>
</html>
