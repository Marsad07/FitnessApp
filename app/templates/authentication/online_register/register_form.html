{% extends "online/base.html" %}

{% block title %}Register Form{% endblock %}

{% block content %}
    <h1 style="text-align: center">Register Form</h1>
    <form method="post" style="text-align: center" action="{{ url_for('auth.register')}}">
        <label for="username">UserName:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="8"><br><br>

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required><br><br>

        <input type="submit" value="Submit">
    </form>
{% endblock %}
