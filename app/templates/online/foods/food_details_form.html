<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Details Form</title>
</head>
<body>
    <h1 style="text-alignment=center"></h1><br>
    <div>
        <form method="get" action="/routes/food_chosen">
            <input type="hidden" name="fdcId" value="{{ fdc_id }}">
            <label for="meal_category">Meal Category</label><br>
            <select name="meal_category" id="meal_category">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
            </select><br>

            <h3>Food Weight</h3><br>
            <label for="food_weight"></label>
            <input type="number" id="food_weight" name="food_weight">
            <button type="submit" id="submit_btn">Submit</button>
        </form>
    </div>
</body>
</html>
