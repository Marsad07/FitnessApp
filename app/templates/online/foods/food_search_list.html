{% extends "online/base.html" %}

{% block title %}Food Search List{% endblock %}

{% block content %}
    <h1>Food Search List</h1>
    <div>
        {% for item in foods %}
            <p>
                <a href="/routes/food_chosen?fdcId={{ item.fdcId }}">{{ item.description }}</a>
            </p>
        {% else %}
            <p>No items found, please search for something else</p>
        {% endfor %}
    </div>
{% endblock %}
